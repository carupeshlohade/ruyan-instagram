name: growth-log
on:
  schedule: [{cron: "40 17 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python growth_log.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - run: |
          git config user.name "ruyan-bot"; git config user.email "bot@users.noreply.github.com"
          git add followers_log.csv insights_log.csv
          git diff --cached --quiet || (git commit -m "growth log" && git pull --rebase && git push)
