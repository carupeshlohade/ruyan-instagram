name: keyword-dm
on:
  schedule: [{cron: "7,22,37,52 * * * *"}]
  workflow_dispatch:
    inputs:
      mode: {description: "run or check", default: "check"}
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python dm_keywords.py ${{ github.event.inputs.mode == 'check' && '--check' || '' }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - run: |
          git config user.name ruyan-bot; git config user.email bot@users.noreply.github.com
          git add dm_log.csv 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "keyword dm log" && git pull --rebase && git push)
